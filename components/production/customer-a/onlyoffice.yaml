# ONLYOFFICE Docs for Customer A.
#
# In the customer data plane, never in the control plane. It opens, converts,
# and caches customer documents, so it handles exactly the data the two-pillar
# model exists to keep inside the customer's own account.

chart:
  repoURL: https://download.onlyoffice.com/charts/stable
  name: docs
  version: "<pinned, see runbook 11.4>"
  namespace: onlyoffice

image:
  tag: <pinned tag>

# All in the customer data plane account.
connections:
  dbType: postgres
  dbHost: <customer-a rds endpoint>
  dbName: onlyoffice
  dbUser: onlyoffice
  dbExistingSecret: onlyoffice-db
  redisHost: <customer-a elasticache endpoint>
  amqpHost: <customer-a amazon mq endpoint>
  amqpExistingSecret: onlyoffice-amqp

docservice:
  replicas: 2
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits:   { memory: 4Gi }

converter:
  replicas: 2
  resources:
    requests: { cpu: 2, memory: 4Gi }
    limits:   { memory: 8Gi }

ingress:
  host: docs-customer-a.lexplosion.com
