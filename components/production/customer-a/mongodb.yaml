# MongoDB for Customer A. Runs inside their data plane, because the data is
# theirs and never leaves their account.
#
# The bucket is in the customer's own account, and the backup agent reaches it
# through a Pod Identity association rather than a stored key.

chart:
  repoURL: https://percona.github.io/percona-helm-charts
  name: psmdb-db
  version: "1.23.0 "
  namespace: data

crVersion: "1.23.0 "
image: percona/percona-server-mongodb:1.23.0 

replsets:
  rs0:
    size: 3
    resources:
      requests: { cpu: 1, memory: 4Gi }
      limits:   { memory: 8Gi }
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests: { storage: 100Gi }

backup:
  enabled: true
  image: percona/percona-backup-mongodb:1.23.0
  storages:
    s3-data-plane:
      s3:
        bucket: komtrol-customer-a-mongo-backup
  pitr:
    enabled: true
  tasks:
    - name: daily
      schedule: "0 18 * * *"
      storageName: s3-data-plane
      keep: 30
