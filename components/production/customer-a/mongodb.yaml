# MongoDB for Customer A. Runs inside their data plane, because the data is
# theirs and never leaves their account.
#
# The bucket is in the customer's own account, and the backup agent reaches it
# through a Pod Identity association rather than a stored key.

chart:
  repoURL: https://percona.github.io/percona-helm-charts
  name: psmdb-db
  version: "1.23.0"
  namespace: data

crVersion: "1.23.0"
image:
  repository: percona/percona-server-mongodb
  tag: "8.0.26-11"

replsets:
  rs0:
    size: 3
    resources:
      requests: { cpu: 1, memory: 1Gi }
      limits:   { memory: 2Gi }
    volumeSpec:
      pvc:
        resources:
          requests: 
             storage: 10Gi 

backup:
  enabled: true
  image: 
    repository: percona/percona-backup-mongodb
    tag: "2.15.0"
  storages:
    s3-data-plane:
      s3:
        bucket: komtrol-customer-a-mongo-backup
  pitr:
    enabled: true
  tasks:
    - name: daily
      schedule: "0 18 * * *"
      storageName: s3-data-plane
      keep: 30
