# Cluster objects for Customer A's data plane.

chart:
  name: komtrol-platform

clusterName: kubeodin

nodeClass:
  amiFamily: Bottlerocket
  amiSelectorAlias: bottlerocket@1.64.0
  role: KarpenterNodeRole-kubeodin
  dataVolumeGiB: 10

default:
  cpuLimit: "10"

critical:
  enabled: true
  cpuLimit: "10"
