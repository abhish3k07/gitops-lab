apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "komtrol-service.fullname" . }}
  labels: {{- include "komtrol-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# No IRSA annotation. The platform team binds an EKS Pod Identity association
# to this ServiceAccount name instead, per environment, so the service never
# holds a credential and never receives a role that can reach another
# environment's data. See runbook 7.2.
