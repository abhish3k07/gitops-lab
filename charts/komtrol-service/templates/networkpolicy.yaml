apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "komtrol-service.fullname" . }}-allow
  labels: {{- include "komtrol-service.labels" . | nindent 4 }}
spec:
  # The namespace denies all ingress by default and enforcement is active, so
  # a policy that does not exist is a service that cannot be reached.
  podSelector:
    matchLabels: {{- include "komtrol-service.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # The load balancer controller and kubelet probes
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        {{- range .Values.allowFrom }}
        - podSelector:
            matchLabels:
              app: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
