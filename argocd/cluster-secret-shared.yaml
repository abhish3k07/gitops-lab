# The staging cluster, registered exactly like a customer's.
#
# Staging is not a special case in this repository. It is one tenant of one
# environment, it carries the same three labels, and the same ApplicationSet
# deploys to it. That is the point of the layout.
apiVersion: v1
kind: Secret
metadata:
  # The ArgoCD cluster name, and it equals the tenant label deliberately.
  # Three names are in play and they are not the same thing:
  #
  #   shared           this, the ArgoCD cluster name and the tenant
  #   komtrol-staging  the EKS cluster, an AWS resource name
  #   staging          the environment, the first path segment
  #
  # Keeping the first two aligned across every tenant means an Application
  # called komtrol-api-shared can only have come from values/staging/shared/.
  name: shared
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    environment: staging
    tenant: shared
    wave: "0"          # ahead of every customer wave, and never manual
type: Opaque
stringData:
  name: shared
  server: https://<cluster endpoint>
  config: |
    {
      "awsAuthConfig": {
        "clusterName": "komtrol-staging",
        "roleARN": "arn:aws:iam::111122223333:role/ArgoCDDeployer"
      },
      "tlsClientConfig": { "insecure": false, "caData": "<base64 CA>" }
    }
