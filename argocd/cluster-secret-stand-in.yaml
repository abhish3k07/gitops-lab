# Written by Terragrunt as the last step of provisioning a data plane. From
# the moment it exists, the ApplicationSets pick the cluster up.
#
# The labels are load bearing. Two of them are the values path:
#
#   environment + tenant -> values/<environment>/<tenant>/
#
# and the third decides which ApplicationSet owns the cluster:
#
#   wave  1, 2, 3 or 0 -> automatic     manual -> released by hand
#
# A cluster missing environment or tenant is skipped by both ApplicationSets
# rather than deployed to the wrong path. A window label is read only for the
# manual wave, and is required there.
apiVersion: v1
kind: Secret
metadata:
  name: stand-in
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    # Staging, because the account is Lexplosion's own. Note that this is the
    # only staging-shaped thing about it: the cluster is provisioned to
    # production specification and the values are production values, or the
    # rehearsal proves nothing.
    environment: staging
    tenant: stand-in
    wave: "1"
type: Opaque
stringData:
  name: stand-in
  server: https://<cluster endpoint>
  config: |
    {
      "awsAuthConfig": {
        "clusterName": "komtrol-stand-in",
        "roleARN": "arn:aws:iam::111122223333:role/ArgoCDDeployer"
      },
      "tlsClientConfig": { "insecure": false, "caData": "<base64 CA>" }
    }
