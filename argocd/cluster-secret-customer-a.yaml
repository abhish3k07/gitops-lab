# Customer A, whose contract rules out unattended changes. The only thing that
# puts this cluster on the manual wave is the wave label. The values files, the
# chart, and the path rule are identical to every other tenant.
apiVersion: v1
kind: Secret
metadata:
  name: customer-a
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    environment: production
    tenant: customer-a
    wave: manual
    # Required on the manual wave. The manual ApplicationSet renders it into an
    # annotation with missingkey=error, so a cluster that omits it fails loudly
    # rather than syncing outside the agreed window.
    window: sat-0200-0400-ist
type: Opaque
stringData:
  name: customer-a
  server: https://<cluster endpoint>
  config: |
    {
      "awsAuthConfig": {
        "clusterName": "komtrol-customer-a",
        "roleARN": "arn:aws:iam::444455556666:role/ArgoCDDeployer"
      },
      "tlsClientConfig": { "insecure": false, "caData": "<base64 CA>" }
    }
